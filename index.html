<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днём рождения! ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Potpuno ispravan i proveren Google Fonts link -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <audio id="bg-music" src="assets/music.mp3" loop></audio>
    
    <section id="intro" class="page active">
        <!-- Click-area sada obavija ceo uvodni deo kako bi klik bilo gde aktivirao pismo bez greške -->
        <div class="click-area">
            <div class="hero">
                <div class="glass">
                    Нажми на любую розу
                </div>
                <div class="rose">🌹</div>
            </div>
        </div>
    </section>

    <section id="opened" class="page">
        <!-- Kontrole zvuka su pomerene na sam vrh body-ja sekcije kako bi ih JS uvek video odmah po otvaranju -->
        <div class="volume-container">
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.2">
            <button id="music-toggle" class="music-btn">🎵</button>
        </div>
        
        <div class="letter">
            <div class="paper">
                <div class="mali-polaroid slika-1">
                    <img src="assets/picture1.png" alt="foto1">
                </div>
                <div class="mali-polaroid slika-2">
                    <img src="assets/picture2.png" alt="foto2">
                </div>
                <div class="mali-polaroid slika-3">
                    <img src="assets/picture3.png" alt="foto3">
                </div>
                <div class="mali-polaroid slika-4">
                    <img src="assets/picture4.png" alt="foto4">
                </div>

                <!-- Glavna slika na koju se klikće za vatromet -->
                <div id="glavna-slika" class="photo-frame" style="cursor: pointer;">
                    <img src="picture.png" alt="photo">
                    <div class="clip"></div>
                    <div id="signature"></div>
                </div>
                <div class="content">
                    <div id="message"></div>
                </div>
            </div>
            
            <div id="tekst-pesme">Мари Краймбрери - Happy Birthday, Girl! 🎵</div>
            
            <div class="player-container">
                <button id="player-play" class="player-btn">▶</button>
                <div class="progress-container">
                    <div id="progress-bar" class="progress"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Tačan redosled učitavanja: Prvo tekstualni podaci, pa tek onda izvršna logika sajta -->
    <script src="message.js"></script>
    <script src="script.js"></script>
</body>
</html>
