<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>С днём рождения! ❤️</title>
    
    <!-- === PREVIEW KARTICA ZA DISCORD, INSTAGRAM I VIBER === -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="С днём рождения! ❤️">
    <meta property="og:description" content="Нажми для сюрприза... 🎁✨">
    <meta property="og:image" content="https://github.io">
    <!-- =================================================== -->

    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <audio id="bg-music" src="assets/music.mp3" loop></audio>

    <!-- STRANA 1: Uvod sa buketom ruza -->
    <section id="intro" class="page active">
        <div class="click-area">
            <div class="hero">
                <div class="glass">Нажми на любую розу</div>
                <div class="rose">🌹</div>
            </div>
        </div>
    </section>

    <!-- STRANA 2: Pismo sa polaroidima i plejerom -->
    <section id="opened" class="page">
        <div class="volume-container">
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.2">
            <button id="music-toggle" class="music-btn">🎵</button>
        </div>

        <div class="letter">
            <div class="paper">
                <div class="mali-polaroid slika-1"><img src="assets/picture1.png" alt="foto1"></div>
                <div class="mali-polaroid slika-2"><img src="assets/picture2.png" alt="foto2"></div>
                <div class="mali-polaroid slika-3"><img src="assets/picture3.png" alt="foto3"></div>
                <div class="mali-polaroid slika-4"><img src="assets/picture4.png" alt="foto4"></div>

                <div id="glavna-slika" class="photo-frame">
                    <img src="picture.png" alt="photo">
                    <div class="clip"></div>
                    <div id="signature"></div>
                </div>

                <div class="content">
                    <div id="message"></div>
                </div>
            </div>

            <div id="tekst-pesme">Мари Краймбрери - Happy Birthday, Girl! 🎵</div>

            <div class="player-container">
                <button id="player-play" class="player-btn">▶</button>
                <div class="progress-container">
                    <div id="progress-bar" class="progress"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="message.js"></script>
    <script src="script.js"></script>
</body>
</html>
