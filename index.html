<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>С днём рождения! ❤️</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <audio id="bg-music" src="assets/music.mp3" loop></audio>

    <section id="intro" class="page active">

        <div class="click-area">

            <div class="hero">

                <div class="glass">
                    Нажми на любую розу
                </div>

                <div class="rose">🌹</div>

            </div>

        </div>

    </section>

    <section id="opened" class="page">

        <div class="letter">

            <div class="paper">

                <div class="mali-polaroid slika-1">
                    <img src="assets/picture1.png">
                </div>

                <div class="mali-polaroid slika-2">
                    <img src="assets/picture2.png">
                </div>

                <div class="mali-polaroid slika-3">
                    <img src="assets/picture3.png">
                </div>

                <div class="mali-polaroid slika-4">
                    <img src="assets/picture4.png">
                </div>

                <div id="glavna-slika" class="photo-frame">

                    <img src="picture.png">

                    <div id="signature"></div>

                </div>

                <div class="content">

                    <div id="message"></div>

                </div>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
